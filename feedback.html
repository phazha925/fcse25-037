<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CB Stores | Contact / Feedback</title>
  <link rel="stylesheet" href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css)" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="topbar">
      <a href="home.html" class="brand">CB Stores</a>
      <div class="header-actions">
        <a href="products.html" aria-label="Shopping cart"><i class="bi bi-cart3" aria-hidden="true"></i></a>
        <a href="stores.html" aria-label="Store locations"><i class="bi bi-geo-alt" aria-hidden="true"></i></a>
      </div>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="promotions.html">Promotions</a></li>
        <li><a href="stores.html">Stores</a></li>
        <li><a href="feedback.html" aria-current="page">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="page-main">
    <section class="content-block narrow">
      <h1>Contact / Feedback</h1>
      <p>Use the accessible form below to contact our team or share feedback about your shopping experience.</p>

      <form id="contactForm" class="contact-form" novalidate>
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" required aria-describedby="nameError" />
          <p id="nameError" class="error-message" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required aria-describedby="emailError" />
          <p id="emailError" class="error-message" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required aria-describedby="subjectError" />
          <p id="subjectError" class="error-message" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required aria-describedby="messageError"></textarea>
          <p id="messageError" class="error-message" aria-live="polite"></p>
        </div>

        <button type="submit">Send Message</button>
        <p id="formStatus" class="form-status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CBStores. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
